<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Boncybee: Artist and music creator. Explore the music journey and upcoming releases. Stay connected with Boncybee on social media.">
    <meta name="author" content="Boncybee">
    <meta name="keywords" content="Boncybee, music, artist, coming soon, Spotify, Deezer, Apple Music, social media, give me">
    <meta property="og:title" content="Boncybee - Music Artist">
    <meta property="og:description" content="Explore Boncybee's music and upcoming releases. Stay connected on social media platforms.">
    <meta property="og:image" content="media/LogoWhiteNoBack.png">
    <meta property="og:type" content="website">
    <title>Boncybee - Music Artist</title>
    <link rel="icon" href="media/LogoWhiteNoBack.png" type="image/png">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        @font-face {
            font-family: 'CustomFont';
            src: url('fonts/OTF/Archive-Regular.otf') format('opentype'),
                 url('fonts/TTF/Archive-Regular.ttf') format('truetype');
        }
        body, html {
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }
        .page {
            height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            position: relative;
        }
        .firstPage {
            background-color: black;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .secondPage {
            background-color: #222;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        .Archive-Regular {
            font-family: 'CustomFont';
            font-size: 8vh;
        }
        .Archive-Regular-little {
            font-family: 'CustomFont';
            font-size: 2vh;
        }
        .logo {
            max-width: 40%;
            z-index: 1;
        }
        .cover-image {
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        .background-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .social-icons i {
            font-size: 2rem;
            margin: 0 10px;
            color: white;
        }
        .social-icons i:hover {
            transform: scale(1.1);
            transition: transform 0.3s;
        }

        .txt-button{
            color: #535864 !important;
        }

        /* Scroll to bottom arrow */
        .scroll-arrow {
            position: absolute;
            bottom: 70px;
            transform: translateX(-50%);
            font-size: 2rem;
            color: white;
            cursor: pointer;
            animation: bounce 1.5s infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .logo {
                max-width: 60%; /* Adjust the logo size on smaller screens */
            }
            .cover-image {
                max-width: 60%; /* Adjust the cover image size */
            }
        }

        @media (min-width: 769px) {
            .logo {
                max-width: 30%; /* Adjust logo size for larger screens */
            }
            .cover-image {
                max-width: 30%; /* Adjust the cover image size */
            }
        }
    </style>
</head>
<body>
    <div class="page firstPage">
        <div>
            <img src="media/LogoWhiteNoBack.png" alt="Boncybee Logo" class="img-fluid logo">
            <p class="mt-3 Archive-Regular">BONCYBEE</p>
            <div class="social-icons mt-3">
                <a href="https://www.instagram.com/boncybee" target="_blank" title="Suivez Boncybee sur Instagram"><i class="fab fa-instagram mt-3"></i></a>
                <a href="https://open.spotify.com/intl-fr/artist/7ouLMx4Bw10e5zP0ocAOxF?si=Ks40_LgAR6-7eDinWf36Gw" target="_blank" title="Écoutez Boncybee sur Spotify"><i class="fab fa-spotify mt-3"></i></a>
                <a href="https://music.apple.com/fr/artist/boncybee/1518042418" target="_blank" title="Écoutez Boncybee sur Apple Music"><i class="fab fa-apple mt-3"></i></a>
                <a href="https://deezer.page.link/bA8MVFSUmNLnQWw76" target="_blank" title="Écoutez Boncybee sur Deezer"><i class="fab fa-deezer mt-3"></i></a>
            </div>
        </div>
        <!-- Scroll arrow to bottom -->
        <div class="scroll-arrow" onclick="document.querySelector('.secondPage').scrollIntoView();">
            <i class="fas fa-arrow-down"></i>
        </div>
    </div>
    <div class="page secondPage">
        <img src="media/Background_GiveMe.jpg" alt="Boncybee Cover" class="background-cover">
        <img src="media/Cover_Give_Me.jpg" alt="Boncybee Logo" class="img-fluid logo cover-image" style="z-index: 1;">
        <div class="text-center mt-5" style="position: relative; z-index: 2;">
            <a href="https://bfan.link/giveme" class="btn btn-light btn-lg Archive-Regular-little mt-4 txt-button" role="button">Explore More</a>
        </div>
    </div>
</body>
</html>
