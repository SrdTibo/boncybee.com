        <style>
            @font-face {
                font-family: 'CustomFont';
                src: url('fonts/OTF/Archive-Regular.otf') format('opentype'),
                     url('fonts/TTF/Archive-Regular.ttf') format('truetype');
            }
            body {
                background-color: black;
                overflow: hidden; /* Empêche le défilement */
                height: 100vh; /* Assure que le body occupe toute la hauteur de la fenêtre */
                margin: 0; /* Supprime les marges par défaut */
                color: white; /* Définit la couleur du texte en blanc */
                display: flex;
                justify-content: center;
                align-items: center;
                text-align: center;
            }
            .Archive-Regular {
                font-family: 'CustomFont';
                font-size: 8vh;
            }
            .container {
                height: 100vh; /* Assure que le conteneur occupe toute la hauteur de la fenêtre */
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }
            .logo {
                max-width: 50%; /* Réduit la taille de l'image */
            }
            .circle {
                position: absolute;
                border: solid 2px #ccc;
                width: 65px;
                height: 65px;

                font-size: 2rem;
                margin: 0 10px;
                color: white;

                transform: scale(1.1); /* Grossit l'icône à 120% de sa taille originale */
                transition: transform 0.3s; /* Ajoute une transition douce */
            }

            /* Media query pour masquer le cercle sur les appareils mobiles */
            @media (max-width: 1280px) {
                .circle {
                    display: none;
                }
            }
        </style>
    </head>
<body>

    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
        jQuery(document).ready(function() {
            var mouseX = 0, mouseY = 0;
            var xp = 0, yp = 0;

            $(document).mousemove(function(e){
                mouseX = e.pageX - 30;
                mouseY = e.pageY - 30;
            });

            setInterval(function(){
                xp += ((mouseX - xp)/6);
                yp += ((mouseY - yp)/6);
                $("#circle").css({left: xp +'px', top: yp +'px'});
            }, 20);
        });
    </script>
